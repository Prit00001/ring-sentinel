[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-sentinel"
version = "0.1.0"
description = "Defense-only fraud risk system for coordinated card-not-present rings, IEEE-CIS dataset, Razorpay AI Buildathon Track 2"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Ring Sentinel", email = "ring-sentinel@example.com"}
]
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "scipy>=1.10",
    "networkx>=3.0",
    "pyarrow>=13",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "matplotlib>=3.8",
    "pytest>=7.4",
    "groq>=0.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "shap>=0.42",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
